<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="小本本 xbb">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="/src/tw4.css">
    <link rel="apple-touch-icon" href="/icon-192-touch.png?v=1">
    <link rel="manifest" href="/manifest.json">
    <title>大大小本本✨𝕕𝕕𝕩𝕓𝕓.𝕔𝕔</title>
    <script type="module" src="/src/ui/routes.tsx"></script>
    <style>     /* height: 100%; margin: 0; */
      :root {--bt-color: #0ea5e9; color-scheme: dark light; } /* --bt-color:light-dark(#0ea5e9, #38bdf8) need chromium 123  */
      html, body {  background: #0b0e13; color: darkgray; font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell }
      #app { display: flex; flex-direction: row; height: 100%; overflow: hidden; }
      canvas { display: flex; width: 100%; height: 100%; }
      .progress { position: absolute; right: 16px; bottom: 55px; width: 240px; height: 10px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,0.05); }
      .progress > .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22d3ee); transition: width 120ms ease; }
      .stts { position: absolute; right: 16px; bottom: 16px; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
      aside button {padding: 22px;}
      a,input { color: var(--bt-color); text-decoration: none; margin: 3px }
      input { border:0}
      button:hover {color:white; background-color: #222;}
      button.selected { background-color: #38bff83a;}
      button{ color:var(--bt-color); font-size:larger;background: none; border: none;}

      /* --- Layout & Shared --- */
      .app-root { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      .content { position: relative; z-index: 1; width: 100%; height: 100%; overflow: auto; }
      .tabs-page { width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); }
      .sea-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
      .split-container { display: flex; width: 100%; height: 100%; position: relative; }
      .left-panel { overflow: auto; background: rgba(30, 30, 40, 0.9); border-right: 1px solid rgba(255, 255, 255, 0.1); }
      .right-panel { overflow: auto; }
      .resize-handle { width: 4px; background: rgba(255, 255, 255, 0.2); cursor: col-resize; transition: background 0.2s; }
      .resize-handle:hover { background: #3b82f6; }

      /* --- Navigation & Bars --- */
      .user-menu-container { position: relative; pointer-events: auto; }
      .user-avatar { width: 40px; height: 40px; margin: 11px; border-radius: 50%; overflow: hidden; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 20px; }
      .avatar-img { width: 100%; height: 100%; object-fit: cover; }
      .user-avatar:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
      .user-dropdown { position: absolute; top: 77px; right: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 222px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-height: calc(100vh - 100px); overflow-y: auto; }
      .user-dropdown-item { padding: 8px 12px; color: white; text-decoration: none; font-size: 13px; border-radius: 6px; cursor: pointer; transition: background 0.2s; border: none; background: none; text-align: left; width: 100%; }
      .user-dropdown-item:hover { background: rgba(255, 255, 255, 0.1); }
      .signin-btn { pointer-events: auto; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
      .signin-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
      .filter-bar { z-index: 2; position: fixed; display: flex; bottom: 77px; left: 0; right: 0; align-items: flex-end; }

      /* --- View Containers --- */
      .editor-split-pane { display: flex; flex-direction: column; height: 100%; background: rgba(20, 20, 30, 0.95); }
      .editor-container { flex: 2; min-height: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
      .chat-container { display: flex; flex-direction: column; height: 100%; background: rgba(0, 0, 0, 0.3); flex: 1; min-height: 0; }
      .Artfact-container { height: 100%; display: flex; flex-direction: column; }
      .code-editor { flex: 1; overflow: auto; }
      .Artfact-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 15px; color: white; }

      /* --- Tables & Lists --- */
      .tags-table-container { height: 100%; display: flex; flex-direction: column; }
      .table-wrapper { flex: 1; overflow: auto; }
      .tags-table { width: 100%; border-collapse: collapse; color: white; }
      .tags-table th { text-align: left; padding: 12px; background: rgba(0, 0, 0, 0.5); position: sticky; top: 0; font-weight: 600; }
      .tag-row { cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
      .tag-row:hover { background: rgba(59, 130, 246, 0.2); }
      .tag-row.selected { background: rgba(59, 130, 246, 0.3); }
      .tag-row td { padding: 12px; }
      .ref-cell { font-family: monospace; font-size: 12px; color: #a0a0a0; }

      /* --- Badges & Status --- */
      .status-badges { display: flex; gap: 6px; flex-wrap: wrap; }
      .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 500; }
      .status-active { background: #22c55e; color: black; }
      .status-deprecated { background: #ef4444; }
      .status-experimental { background: #f59e0b; }
      .status-stable { background: #3b82f6; }
      .status-beta { background: #8b5cf6; }

      /* --- UI Elements (Input, Buttons, etc) --- */
      .search-bar { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
      .search-input { width: 100%; padding: 10px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: white; font-size: 14px; }
      .search-input:focus { outline: none; border-color: #3b82f6; }
      .add-tab-btn { padding: 10px 20px; background: #3b82f6; border: none; border-radius: 8px; color: white; cursor: pointer; }

      /* --- Tabs & Artifacts --- */
      .tab-bar { display: flex; background: rgba(0, 0, 0, 0.5); border-bottom: 1px solid rgba(255, 255, 255, 0.1); overflow-x: auto; flex-shrink: 0; }
      .tab { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255, 255, 255, 0.05); border-right: 1px solid rgba(255, 255, 255, 0.1); cursor: pointer; font-size: 12px; white-space: nowrap; }
      .tab.active { background: rgba(59, 130, 246, 0.3); border-bottom: 2px solid #3b82f6; }
      .tab-name { color: white; }
      .tab-name.active-ref { cursor: pointer; transition: text-decoration 0.2s; }
      .tab-name.active-ref:hover { text-decoration: underline; }
      .tab-close { background: none; border: none; color: #888; cursor: pointer; font-size: 18px; padding: 0 4px; }
      .tab-close:hover { color: white; }
      .new-tab-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; padding: 8px 12px; }

      /* --- Dropdowns & Portals --- */
      .tab-dropdown-portal { position: absolute; top: 35px; z-index: 1000; pointer-events: auto; }
      .tab-dropdown-content { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); color: white; }
      .dropdown-field { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
      .dropdown-field label { color: #aaa; }
      .dropdown-field input, .dropdown-field select { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 4px; color: white; padding: 2px 6px; font-size: 12px; }
      .dropdown-meta { border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; margin-top: 4px; }
      .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; font-size: 12px; }
      .meta-item span:first-child { color: #888; }
      .dropdown-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
      .dropdown-actions button { padding: 4px 12px; font-size: 12px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); color: white; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.1); }
      .dropdown-actions .btn-save { background: #3b82f6; border-color: #3b82f6; }
      .dropdown-actions button:hover { background: rgba(255, 255, 255, 0.2); }

      /* --- Chat UI --- */
      .chat-header { padding: 12px; background: rgba(0, 0, 0, 0.5); border-bottom: 1px solid rgba(255, 255, 255, 0.1); flex-shrink: 0; }
      .chat-header h3 { color: white; font-size: 14px; }
      .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
      .message { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
      .message-avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
      .message-content { flex: 1; }
      .message-text { background: rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 12px; color: white; font-size: 14px; }
      .message.user .message-text { background: #3b82f6; }
      .message-time { font-size: 10px; color: #888; margin-top: 4px; margin-left: 8px; }
      .typing-indicator { background: rgba(255, 255, 255, 0.1); padding: 8px 12px; border-radius: 12px; color: white; font-size: 14px; }
      .chat-input-area { padding: 12px; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; gap: 10px; flex-shrink: 0; }
      .chat-input { flex: 1; padding: 8px 12px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: white; }
      .send-btn { padding: 8px 16px; background: #3b82f6; border: none; border-radius: 8px; color: white; cursor: pointer; }
      .load-more-trigger { text-align: center; padding: 20px; color: #888; }
      .mobile-drilldown-hint { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); padding: 5px 10px; border-radius: 20px; font-size: 12px; color: white; pointer-events: none; z-index: 3; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* --- cs1 card renderer --- */
      .cs1-match { color: var(--bt-color); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; max-width: max(33.33%, 222px); overflow-x: auto; overflow-y: hidden; white-space: nowrap; vertical-align: bottom; }
      button.cs1-match { background: rgba(255,255,255,0.05); border: 1px solid var(--bt-color); }
      a.cs1-match:hover { text-decoration: underline; }
      /* Hairline WebKit scrollbar under an overflowing match row. */
      .cs1-match::-webkit-scrollbar { height: 1px; width: 1px; }
      .cs1-match::-webkit-scrollbar-track { background: transparent; }
      .cs1-match::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.35); border-radius: 1px; }
      .cs1-match::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.5); }

      /* --- hover preview (dark panel, same family as .tab-dropdown-content) --- */
      .tip > * > :first-child { margin-top: 0; }
      .tip > * > :last-child { margin-bottom: 0; }
      .tip .cm-editor { background: transparent; }
      .tip .cm-gutters { display: none; }
      /* Tailwind's preflight gives headings and lists the body size and no markers,
         so the preview restores the block rhythm a markdown row is read with. */
      .tip-md { word-break: break-word; }
      .tip-md > :first-child { margin-top: 0; }
      .tip-md > :last-child { margin-bottom: 0; }
      .tip-md h1, .tip-md h2, .tip-md h3, .tip-md h4, .tip-md h5, .tip-md h6 { font-weight: 700; line-height: 1.3; margin: 10px 0 5px; }
      .tip-md h1 { font-size: 1.45em; }
      .tip-md h2 { font-size: 1.25em; }
      .tip-md h3 { font-size: 1.12em; }
      .tip-md h4, .tip-md h5, .tip-md h6 { font-size: 1em; opacity: 0.85; }
      .tip-md p { margin: 6px 0; }
      .tip-md ul, .tip-md ol { margin: 6px 0; padding-left: 1.6em; }
      .tip-md ul { list-style: disc; }
      .tip-md ol { list-style: decimal; }
      .tip-md ul ul { list-style: circle; }
      .tip-md ul ul ul { list-style: square; }
      .tip-md li { margin: 2px 0; }
      .tip-md li > p { margin: 0; }
      .tip-md code { background: rgba(255, 255, 255, 0.14); border-radius: 3px; padding: 0 3px; font-size: 0.9em; }
      .tip-md pre { background: rgba(255, 255, 255, 0.08); border-radius: 6px; margin: 6px 0; padding: 6px 8px; overflow-x: auto; }
      .tip-md pre code { background: none; padding: 0; }
      .tip-md blockquote { border-left: 3px solid rgba(255, 255, 255, 0.25); margin: 6px 0; padding-left: 8px; opacity: 0.85; }
      .tip-md a { color: #7ab8ff; text-decoration: underline; }
      .tip-md hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.2); margin: 10px 0; }
      .tip-md img { max-width: 100%; }
      /* Math renders after the preview text: the TeX shows first, then MathML. */
      .md-math[data-display="0"] { opacity: 0.75; font-style: italic; }
      .md-math[data-display="1"] { display: block; margin: 6px 0; opacity: 0.75; }
      .md-math[data-math-done] { opacity: 1; font-style: normal; }

      /* --- Scrollbars --- */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
      ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }

      .ascii-wrap {
        /* font-family: monospace; */
        font-size: 32px;
        color: var(--bt-color);
        text-shadow: 0 0 5px var(--bt-color);
      display: flex;
      justify-content: center; /* Horizontal centering */
      text-align: center; /* Horizontal centering */
      align-items: center;     /* Vertical centering */
      min-height: 100vh;       /* Takes full viewport height */
      /* display: flex; */
        animation: pulse 1.5s infinite alternate ease-in-out;
      }
      @keyframes pulse { from {text-shadow: 0 0 2px var(--bt-color);
          opacity: 0.6;
        }
        to {
          text-shadow: 0 0 15px var(--bt-color), 0 0 25px var(--bt-color);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"> <div class="ascii-wrap">小本本<br>x b b</div> </div>
      <div class="progress" id="progress" style="display: none;"><div class="bar" id="progress-bar" /> </div>
  </body>
  </html>
